apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-chatbot-backend
  namespace: mcp-chatbot
  labels:
    app: mcp-chatbot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-chatbot-backend
  template:
    metadata:
      labels:
        app: mcp-chatbot-backend
    spec:
      containers:
        - name: backend
          image: git.shadyknollcave.io/micro/mcp-chatbot-backend:1.0.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Non-sensitive config from ConfigMap
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: mcp-chatbot-config
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: mcp-chatbot-config
                  key: NODE_ENV
            - name: DATABASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: mcp-chatbot-config
                  key: DATABASE_PATH
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: mcp-chatbot-config
                  key: TZ
            - name: FRONTEND_URL
              value: "https://mcp-chatbot.local.shadyknollcave.io"
            - name: MCP_HUE_URL
              valueFrom:
                configMapKeyRef:
                  name: mcp-chatbot-config
                  key: MCP_HUE_URL

            # Sensitive config from Secret (TODO: Replace with sealed-secret.yaml)
            # For now, using placeholder - CHANGE THIS IN PRODUCTION!
            - name: APP_SECRET
              value: "change-this-to-a-secure-random-secret-key-at-least-32-chars"
            - name: JWT_SECRET
              value: "change-this-to-another-secure-random-secret-key"

          volumeMounts:
            - name: data
              mountPath: /app/data

          # Health checks
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcp-chatbot-data
