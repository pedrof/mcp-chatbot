apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-chatbot

# Common labels applied to all resources
labels:
  - pairs:
      app: mcp-chatbot
      environment: production

# Resources to deploy
resources:
  - namespace.yaml
  - configmap.yaml
  # - sealed-secret.yaml  # TODO: Create sealed secret using kubeseal
  - pvc.yaml
  - deployment-backend.yaml
  - deployment-frontend.yaml
  - service-backend.yaml
  - service-frontend.yaml
  - ingress.yaml

# Images to replace (overrides)
# Note: Using patches in overlay instead to avoid image replacement conflicts
