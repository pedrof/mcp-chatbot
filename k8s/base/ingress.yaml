apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-chatbot
  namespace: mcp-chatbot
  annotations:
    # Use Let's Encrypt production issuer
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # nginx-ingress timeout settings for SSE/chat streaming
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-local
  tls:
    - hosts:
        - mcp-chatbot.local.shadyknollcave.io
      secretName: mcp-chatbot-tls
  rules:
    - host: mcp-chatbot.local.shadyknollcave.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-chatbot-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mcp-chatbot-backend
                port:
                  number: 3000
