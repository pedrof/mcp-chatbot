apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-chatbot
  namespace: mcp-chatbot
  annotations:
    # Use Let's Encrypt production issuer
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - mcp-chatbot.local.shadyknollcave.io
      secretName: mcp-chatbot-tls
  rules:
    - host: mcp-chatbot.local.shadyknollcave.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-chatbot-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mcp-chatbot-backend
                port:
                  number: 3000
