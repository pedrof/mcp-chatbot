apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-chatbot

# Base resources
resources:
  - ../../base

# Production-specific image tags
images:
  - name: git.shadyknollcave.io/micro/mcp-chatbot:backend-latest
    newName: git.shadyknollcave.io/micro/mcp-chatbot:backend-1.0.0
  - name: git.shadyknollcave.io/micro/mcp-chatbot:frontend-latest
    newName: git.shadyknollcave.io/micro/mcp-chatbot:frontend-1.0.0

# Production patches
patches:
  # Backend: Scale to 2 replicas
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-chatbot-backend
      spec:
        replicas: 2
    target:
      kind: Deployment
      name: mcp-chatbot-backend

  # Frontend: Scale to 2 replicas
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-chatbot-frontend
      spec:
        replicas: 2
    target:
      kind: Deployment
      name: mcp-chatbot-frontend

  # Backend: Increase resource limits for production
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-chatbot-backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                resources:
                  requests:
                    cpu: 200m
                    memory: 256Mi
                  limits:
                    cpu: 1000m
                    memory: 1Gi
    target:
      kind: Deployment
      name: mcp-chatbot-backend

  # Frontend: Increase resource limits for production
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-chatbot-frontend
      spec:
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
    target:
      kind: Deployment
      name: mcp-chatbot-frontend
