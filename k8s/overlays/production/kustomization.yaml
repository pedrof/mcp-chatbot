apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-chatbot

# Base resources
resources:
  - ../../base

# Production patches
patches:
  # Backend: Scale and set resources
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-chatbot-backend
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: backend
                resources:
                  requests:
                    cpu: 200m
                    memory: 256Mi
                  limits:
                    cpu: 1000m
                    memory: 1Gi
    target:
      kind: Deployment
      name: mcp-chatbot-backend

  # Frontend: Scale and set resources
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-chatbot-frontend
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
    target:
      kind: Deployment
      name: mcp-chatbot-frontend
